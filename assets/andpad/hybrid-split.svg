<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="820" height="290" fill="#ffffff"/>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- ============ REJECTED ============ -->
  <rect x="14" y="14" width="376" height="262" rx="8" fill="#fef4f4" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="34" y="42" font-size="14" font-weight="700" fill="#991b1b">✗  Tested and rejected — permanently</text>
  <text x="34" y="62" font-size="12" fill="#7f1d1d">Ask the vision model for coordinates and extrude them</text>

  <rect x="34" y="80" width="100" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="84" y="104" font-size="12" fill="#475569" text-anchor="middle">floor plan</text>
  <line x1="140" y1="99" x2="164" y2="99" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="170" y="80" width="86" height="38" rx="5" fill="#f5ecfe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="213" y="104" font-size="12" fill="#4c1d95" text-anchor="middle">VLM</text>
  <line x1="262" y1="99" x2="286" y2="99" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>
  <rect x="292" y="80" width="82" height="38" rx="5" fill="#fef4f4" stroke="#dc2626" stroke-width="1.4"/>
  <text x="333" y="99" font-size="11.5" fill="#991b1b" text-anchor="middle">geometry</text>
  <text x="333" y="112" font-size="11.5" fill="#991b1b" text-anchor="middle">(coordinates)</text>

  <text x="34" y="146" font-size="12" font-weight="600" fill="#991b1b">What we measured:</text>
  <g font-size="12" fill="#7f1d1d">
    <text x="46" y="168">•  5–15% coordinate error</text>
    <text x="46" y="190">•  hallucinated walls</text>
    <text x="46" y="212">•  broken topology</text>
  </g>
  <text x="34" y="248" font-size="11.5" fill="#991b1b">A BIM file is a geometric contract, not a draft —</text>
  <text x="34" y="264" font-size="11.5" fill="#991b1b">5% on a wall position is unusable downstream.</text>

  <!-- ============ ADOPTED ============ -->
  <rect x="430" y="14" width="376" height="262" rx="8" fill="#f8fafc" stroke="#0f766e" stroke-width="1.6"/>
  <text x="450" y="42" font-size="14" font-weight="700" fill="#0f766e">✓  Adopted — the hybrid split</text>
  <text x="450" y="62" font-size="12" fill="#475569">Each component does only what it is reliable at</text>

  <rect x="450" y="80" width="336" height="72" rx="6" fill="#e8f1fe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="466" y="102" font-size="13" font-weight="600" fill="#14346e">Deterministic CV engine</text>
  <text x="466" y="121" font-size="11.5" fill="#1e40af">owns ALL geometry — wall centerlines and</text>
  <text x="466" y="137" font-size="11.5" fill="#1e40af">thicknesses, room polygons, opening positions</text>

  <rect x="450" y="164" width="336" height="72" rx="6" fill="#f5ecfe" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="466" y="186" font-size="13" font-weight="600" fill="#4c1d95">VLM semantic layer</text>
  <text x="466" y="205" font-size="11.5" fill="#6d28d9">room labels, opening types, scale reading,</text>
  <text x="466" y="221" font-size="11.5" fill="#6d28d9">advisory QA — and never a single coordinate</text>

  <text x="450" y="258" font-size="11.5" font-weight="600" fill="#0f766e">Judgment to the model, arithmetic to plain code —</text>
  <text x="450" y="272" font-size="11.5" font-weight="600" fill="#0f766e">an invariant enforced by a test, not by code review.</text>
</svg>
